# MotherDuck reads MOTHERDUCK_TOKEN from the environment; passing it as a
# duckdb setting fails on duckdb 1.5 ("can only be set during initialization")
gdelt_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'md:gdelt_db'
      extensions:
        - httpfs
        - parquet
    prod:
      type: duckdb
      path: 'md:gdelt_db'
      extensions:
        - httpfs
        - parquet
