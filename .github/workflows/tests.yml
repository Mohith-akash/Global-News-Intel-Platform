name: Unit Tests

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # the SQL template tests import src/, which needs the app's requirements
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q
