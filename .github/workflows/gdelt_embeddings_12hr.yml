name: 12-Hour Embedding Generation (Voyage AI)

on:
  schedule:
    # Runs every 12 hours (at midnight and noon UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  issues: write   # the failure alert below files an issue; the default token is read-only

jobs:
  generate-embeddings:
    # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v7

    # 2. Set up Python with caching
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run Embedding Job
    - name: Generate Embeddings (Voyage AI)
      env:
        MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      run: |
        echo "🧠 Starting Embedding Generation..."
        python -m dagster job execute -f etl/embedding_job.py -j gdelt_embedding_job
        echo "✅ Embedding Generation Complete."

    # 5. Run Headline Polish Job (runs even if embeddings failed)
    - name: Polish Headlines (Cerebras)
      if: always()
      env:
        MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      run: |
        echo "📰 Starting Headline Polish..."
        python -m dagster job execute -f etl/headline_polish_job.py -j gdelt_headline_polish_job
        echo "✅ Headline Polish Complete."

    - name: Notify on failure
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        echo "::error::GDELT 12-hr embedding job failed - check logs above"
        OPEN=$(gh issue list --state open --json title --jq '[.[] | select(.title | startswith("[ALERT] GDELT embeddings failed"))] | length')
        if [ "$OPEN" != "0" ]; then
          echo "Alert issue already open, not filing another."
          exit 0
        fi
        gh issue create --label bug \
          --title "[ALERT] GDELT embeddings failed $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --body "The 12-hr embedding generation job failed.

        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
